<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รวม 14 ร้านอร่อย โรงเรียนของเรา</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #f5f5f7;
            color: #333;
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            text-align: center;
            padding: 40px 20px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 { font-size: 2.2rem; margin-bottom: 8px; }
        header p { font-size: 1.1rem; opacity: 0.9; }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .shop-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #222;
            margin-bottom: 5px;
        }

        .shop-location {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 12px;
        }

        .btn-view {
            width: 100%;
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-view:hover { background-color: #ee5253; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background-color: white;
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #aaa;
        }

        .close-btn:hover { color: #000; }

        .modal-title { font-size: 1.5rem; color: #ff6b6b; margin-bottom: 10px; }
        .modal-img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; }
        
        .menu-list { list-style: none; margin-top: 10px; }

        .menu-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
        }

        .menu-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

                ]
            }
        ];

        const grid = document.getElementById('shop-grid');
        shops.forEach(shop => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${shop.img}" alt="${shop.name}">
                <div class="card-content">
                    <div>
                        <div class="shop-title">${shop.name}</div>
                        <div class="shop-location">${shop.location}</div>
                    </div>
                    <button class="btn-view" onclick="openModal(${shop.id})">🔍 คลิกดูเมนู & ราคา</button>
                </div>
            `;
            grid.appendChild(card);
        });

        function openModal(shopId) {
            const shop = shops.find(s => s.id === shopId);
            if(!shop) return;

            document.getElementById('modal-shop-name').innerText = shop.name;
            document.getElementById('modal-shop-img').src = shop.img;
            document.getElementById('modal-shop-desc').innerText = shop.desc;

            const menuList = document.getElementById('modal-menu-list');
            menuList.innerHTML = '';
            shop.menus.forEach(m => {
                menuList.innerHTML += `
                    <li class="menu-item">
                        <span>${m.name}</span>
                        <strong style="color:#ff6b6b">${m.price}</strong>
                    </li>
                `;
            });

            document.getElementById('menu-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('menu-modal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('menu-modal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

</html>
